<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34291c"/><stop offset="1" stop-color="#17140f"/></linearGradient>
    <pattern id="grain" width="80" height="64" patternUnits="userSpaceOnUse"><path d="M4 20c20-10 42-10 64 0M18 52c14-6 30-6 48 0" fill="none" stroke="#c8aa70" stroke-width="2" opacity=".07"/></pattern>
    <pattern id="bone" width="64" height="54" patternUnits="userSpaceOnUse"><path d="M8 18l22 16M42 8l12 24M12 44l22-10" fill="none" stroke="#d2c8a8" stroke-width="4" opacity=".16"/></pattern>
    <pattern id="earth" width="62" height="48" patternUnits="userSpaceOnUse"><path d="M4 18l20-9 24 8M10 40l18-7 27 8" fill="none" stroke="#b4835e" stroke-width="3" opacity=".18"/></pattern>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffd34f"/></marker>
