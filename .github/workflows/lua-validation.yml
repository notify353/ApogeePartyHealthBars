name: Distribution validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - run: python -B tests/distribution/test_repository.py
      - run: python -B tests/distribution/test_curseforge.py
  aggregate:
    if: vars.APOGEE_DISTRIBUTION_SOURCES_READY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          path: distribution-repo
      - name: Read immutable child pins
        id: pins
        shell: python
        run: |
          import json, os
          lock=json.load(open('distribution-repo/distribution/candidate.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for child in lock['children']: out.write(child['name']+'='+child['commit']+'\n')
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeHeals
          ref: ${{ steps.pins.outputs.ApogeeHeals }}
          path: sources/ApogeeHeals
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeKeybinds
          ref: ${{ steps.pins.outputs.ApogeeKeybinds }}
          path: sources/ApogeeKeybinds
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeGroupAlert
          ref: ${{ steps.pins.outputs.ApogeeGroupAlert }}
          path: sources/ApogeeGroupAlert
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeEssentials
          ref: ${{ steps.pins.outputs.ApogeeEssentials }}
          path: sources/ApogeeEssentials
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeTank
          ref: ${{ steps.pins.outputs.ApogeeTank }}
          path: sources/ApogeeTank
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN || github.token }}
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate and build both families without publishing
        shell: pwsh
        working-directory: distribution-repo
        run: ./scripts/test-local.ps1 -SourcesRoot "$env:GITHUB_WORKSPACE/sources" -ArtifactRoot "$env:RUNNER_TEMP/apogee-validation"
