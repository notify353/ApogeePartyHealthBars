name: Apogee Forever release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
concurrency:
  group: apogee-production-release
  cancel-in-progress: false
jobs:
  publish:
    permissions:
      contents: write
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          path: distribution-repo
          persist-credentials: false
      - name: Read immutable child pins
        id: pins
        shell: python
        run: |
          import json, os
          lock=json.load(open('distribution-repo/distribution/candidate.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for child in lock['children']: out.write(child['name']+'='+child['commit']+'\n')
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeHeals
          ref: ${{ steps.pins.outputs.ApogeeHeals }}
          path: sources/ApogeeHeals
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeKeybinds
          ref: ${{ steps.pins.outputs.ApogeeKeybinds }}
          path: sources/ApogeeKeybinds
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeGroupAlert
          ref: ${{ steps.pins.outputs.ApogeeGroupAlert }}
          path: sources/ApogeeGroupAlert
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeEssentials
          ref: ${{ steps.pins.outputs.ApogeeEssentials }}
          path: sources/ApogeeEssentials
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.DISTRIBUTION_READ_TOKEN }}
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: notify353/ApogeeTank
          ref: ${{ steps.pins.outputs.ApogeeTank }}
          path: sources/ApogeeTank
          fetch-depth: 0
          persist-credentials: false
          token: ${{ github.token }}
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Validate and build both families
        shell: pwsh
        working-directory: distribution-repo
        run: ./scripts/test-local.ps1 -SourcesRoot "$env:GITHUB_WORKSPACE/sources" -ArtifactRoot "$env:RUNNER_TEMP/apogee-validation"
      - name: Stage exact accepted production package
        working-directory: distribution-repo
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -B scripts/publish_distribution.py stage --version "${RELEASE_TAG#v}" --sources-root "$GITHUB_WORKSPACE/sources" --output "$RUNNER_TEMP/apogee-publication"
      - name: Upload once to CurseForge and GitHub draft
        working-directory: distribution-repo
        env:
          APOGEE_PUBLISH_APPROVED: 'true'
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/publish_distribution.py upload --sources-root "$GITHUB_WORKSPACE/sources" --output "$RUNNER_TEMP/apogee-publication"
      - name: Preserve exact package and upload receipt even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apogee-publication
          path: ${{ runner.temp }}/apogee-publication
          if-no-files-found: warn
          retention-days: 30
