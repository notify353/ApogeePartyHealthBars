name: CurseForge version preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    environment: distribution-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve exact Forever upload version without publishing
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python -B scripts/curseforge_preflight.py
