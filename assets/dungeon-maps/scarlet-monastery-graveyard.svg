<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30271c"/>
      <stop offset="1" stop-color="#17140f"/>
    </linearGradient>
    <pattern id="grain" width="80" height="64" patternUnits="userSpaceOnUse">
      <path d="M4 20c20-10 42-10 64 0M18 52c14-6 30-6 48 0" fill="none" stroke="#c8aa70" stroke-width="2" opacity=".055"/>
    </pattern>
    <pattern id="stone" width="64" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 22h64M32 0v22M16 22v22M48 22v22" fill="none" stroke="#c0b08e" stroke-width="2" opacity=".13"/>
    </pattern>
    <pattern id="grassPattern" width="58" height="58" patternUnits="userSpaceOnUse">
      <path d="M8 44l9-12m18 18 6-15M49 23l-7-10M20 18l-4-9" stroke="#9ba77f" stroke-width="2" opacity=".1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <marker id="mainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.1" markerHeight="3.1" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#ffd34f"/>
    </marker>
    <marker id="optionalArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.1" markerHeight="3.1" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#ee934b"/>
    </marker>
    <style>
      .wall{fill:#625947;stroke:#b9a47b;stroke-width:18;stroke-linejoin:round}
      .floor{fill:#443f37;stroke:#7f735f;stroke-width:7;stroke-linejoin:round}
      .grass{fill:#344634;stroke:#7f8c6d;stroke-width:7;stroke-linejoin:round}
      .door{fill:none;stroke:#d6c59d;stroke-width:14;stroke-linecap:square}
      .route{fill:none;stroke:#ffd34f;stroke-width:17;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#mainArrow);filter:url(#shadow)}
      .optional{fill:none;stroke:#ee934b;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18 16;marker-end:url(#optionalArrow);filter:url(#shadow)}
      .step{fill:#912f37;stroke:#ef9a91;stroke-width:6;filter:url(#shadow)}
      .optionalStep{fill:#b95f28;stroke:#ffd09a;stroke-width:6;filter:url(#shadow)}
      .stepText{font-family:Arial,sans-serif;fill:#fff;font-size:36px;font-weight:700;text-anchor:middle;dominant-baseline:central}
      .grave{fill:#7b735f;stroke:#b7a984;stroke-width:6}
    </style>
  </defs>

  <rect width="2048" height="2048" rx="34" fill="url(#bg)"/>
  <rect x="24" y="24" width="2000" height="2000" rx="28" fill="url(#grain)" stroke="#806d4e" stroke-width="8"/>

  <!-- Forlorn Cloister: one long outdoor graveyard with stepped eastern terraces. -->
  <path class="wall" d="M304 512h744v34h202v96h118v250h-64v220h64v250h-118v96h-202v34H304z"/>
  <path class="grass" d="M334 542h684v34h202v96h118v190h-64v280h64v190h-118v96h-202v34H334z"/>
  <path d="M334 542h684v34h202v96h118v190h-64v280h64v190h-118v96h-202v34H334z" fill="url(#grassPattern)"/>

  <!-- Central processional walk, narrowed doorway, and east-side raised stone plots. -->
  <path class="floor" d="M348 916h650l48-42h228v206h-228l-48-42H348z" fill="url(#stone)"/>
  <path d="M998 874h276v206H998z" fill="url(#stone)" opacity=".55"/>
  <path class="floor" d="M1082 600h236v226h-236z" fill="url(#stone)"/>
  <path class="floor" d="M1082 1128h236v226h-236z" fill="url(#stone)"/>
  <path class="door" d="M1274 918v118"/>

  <!-- Distinct grave markers and low dividing walls preserve the recognizable yard landmarks. -->
  <path d="M650 552v238M650 1166v286M918 552v210M918 1194v268" stroke="#7f8c6d" stroke-width="10"/>
  <g class="grave">
    <path d="M760 626h88v126h-88z"/><path d="M772 606h64l18 22h-100z"/>
    <path d="M706 1218h94v132h-94z"/><path d="M718 1198h70l18 22h-106z"/>
    <path d="M486 650h64v94h-64z"/><path d="M498 634h40l14 18h-68z"/>
    <path d="M908 1288h64v94h-64z"/><path d="M920 1272h40l14 18h-68z"/>
  </g>

  <!-- Honor's Tomb is attached to the west end and resolves into a compact multi-room crypt. -->
  <path class="wall" d="M304 884h-66v-92h-96v-126h118v-72h170v72h118v126h-96v92h-58v188h58v92h96v126H430v72H260v-72H142v-126h96v-92h66z"/>
  <path class="floor" d="M304 916h-96v-94h-42V696h124v-72h110v72h124v126h-42v94h-88v124h88v94h42v126H400v72H290v-72H166v-126h42v-94h96z" fill="url(#stone)"/>
  <rect x="272" y="850" width="170" height="224" rx="18" fill="#514a3e" stroke="#8f8065" stroke-width="7"/>
  <circle cx="357" cy="962" r="38" fill="#292621" stroke="#8f8065" stroke-width="7"/>
  <path class="door" d="M394 884v70M394 1002v70"/>

  <!-- Chamber of Atonement: irregular torture room with central pit and two gate vestibules. -->
  <path class="wall" d="M1368 896h54v-62h98v-54h148v54h98v62h54v94h48v148h-48v94h-54v62h-98v54h-148v-54h-98v-62h-54v-94h-48V990h48z"/>
  <path class="floor" d="M1398 926h54v-62h98v-54h88v54h98v62h54v94h48v88h-48v94h-54v62h-98v54h-88v-54h-98v-62h-54v-94h-48v-88h48z" fill="url(#stone)"/>
  <circle cx="1594" cy="1064" r="56" fill="#28251f" stroke="#8f8065" stroke-width="8"/>
  <path class="door" d="M1368 1010v108M1820 1010v108"/>

  <!-- Entrance stair and dogleg rise from the southeast into Vishas's room. -->
  <path class="wall" d="M1838 1842h-138v-92h-82v-410h-42v-96h146v66h60v410h56z"/>
  <path class="floor" d="M1808 1812h-78v-92h-82v-410h-42v-36h86v66h60v410h56z" fill="url(#stone)"/>
  <path d="M1730 1760h78M1730 1782h78M1730 1804h78" stroke="#c1b38f" stroke-width="8"/>
  <path class="door" d="M1606 1274h86"/>

  <!-- Recommended run: Vishas, optional rare sweep through the yard, then Thalnos in Honor's Tomb. -->
  <path class="route" d="M1768 1784h-78v-500h-96v-148"/>
  <path class="route" d="M1450 1064h-160v-70H390"/>
  <path class="route" d="M390 994h-136"/>
  <path class="optional" d="M1120 940C1030 758 876 684 806 680"/>
  <path class="optional" d="M1016 1048c-76 170-176 230-258 236"/>

  <circle class="step" cx="1594" cy="1064" r="40"/><text class="stepText" x="1594" y="1064">1</text>
  <circle class="optionalStep" cx="806" cy="680" r="38"/><text class="stepText" x="806" y="680">2</text>
  <circle class="optionalStep" cx="758" cy="1284" r="38"/><text class="stepText" x="758" y="1284">2</text>
  <circle class="step" cx="357" cy="962" r="40"/><text class="stepText" x="357" y="962">3</text>
</svg>
