<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34291c"/><stop offset="1" stop-color="#17140f"/></linearGradient>
    <pattern id="grain" width="80" height="64" patternUnits="userSpaceOnUse"><path d="M4 20c20-10 42-10 64 0M18 52c14-6 30-6 48 0" fill="none" stroke="#c8aa70" stroke-width="2" opacity=".07"/></pattern>
    <pattern id="metal" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M0 28h56M28 0v56" fill="none" stroke="#adb0a2" stroke-width="2" opacity=".12"/><circle cx="8" cy="8" r="3" fill="#d0b677" opacity=".35"/></pattern>
    <radialGradient id="toxic" cx="48%" cy="45%" r="62%"><stop stop-color="#3f9690"/><stop offset="1" stop-color="#205b59"/></radialGradient>
    <marker id="mainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffd34f"/></marker>
    <marker id="optionalArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ee934b"/></marker>
    <marker id="alternateArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#68a6c1"/></marker>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".72"/></filter>
    <style>.wall{fill:#706753;stroke:#bba77c;stroke-width:22;stroke-linejoin:round}.floor{fill:url(#metal);stroke:#85877d;stroke-width:8;stroke-linejoin:round}.rail{fill:none;stroke:#242b2d;stroke-width:13;opacity:.72}.machine{fill:#2d3739;stroke:#9a8d69;stroke-width:8}.route{fill:none;stroke:#ffd34f;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;filter:url(#shadow)}.routeEnd{marker-end:url(#mainArrow)}.optional{fill:none;stroke:#ee934b;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:25 20;marker-end:url(#optionalArrow)}.alternate{fill:none;stroke:#68a6c1;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:25 20;marker-end:url(#alternateArrow)}.step{fill:#aa333b;stroke:#ffaaa0;stroke-width:8;filter:url(#shadow)}.optionalStep{fill:#c66b2b;stroke:#ffd39a;stroke-width:8;filter:url(#shadow)}.stepText{font-family:Arial,sans-serif;fill:#fff;font-size:42px;font-weight:700;text-anchor:middle;dominant-baseline:central}.transition{fill:#5f87a5;stroke:#a8d5ef;stroke-width:6;filter:url(#shadow)}</style>
  </defs>
  <rect width="2048" height="2048" rx="34" fill="url(#bg)"/><rect x="24" y="24" width="2000" height="2000" rx="28" fill="url(#grain)" stroke="#806d4e" stroke-width="8"/>

