name: CurseForge version preflight
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    environment: distribution-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Resolve exact Forever upload version without publishing
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python -B scripts/curseforge_preflight.py
