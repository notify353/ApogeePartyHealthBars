<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34291c"/><stop offset="1" stop-color="#17140f"/></linearGradient>
    <pattern id="grain" width="80" height="64" patternUnits="userSpaceOnUse"><path d="M4 20c20-10 42-10 64 0M18 52c14-6 30-6 48 0" fill="none" stroke="#c8aa70" stroke-width="2" opacity=".07"/></pattern>
    <pattern id="stone" width="72" height="52" patternUnits="userSpaceOnUse"><path d="M0 26h72M36 0v26M18 26v26M55 26v26" fill="none" stroke="#c0b08e" stroke-width="2" opacity=".14"/></pattern>
    <marker id="goldArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffd34f"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#68a6c1"/></marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ee934b"/></marker>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".72"/></filter>
    <style>.wall{fill:#6e6450;stroke:#bba77c;stroke-width:22;stroke-linejoin:round}.floor{fill:url(#stone);stroke:#86785f;stroke-width:8;stroke-linejoin:round}.cell{fill:#37322c;stroke:#887b64;stroke-width:9}.bars{stroke:#c2ae82;stroke-width:9;stroke-linecap:round}.drain{fill:#252724;stroke:#8e8168;stroke-width:8}.route{fill:none;stroke:#ffd34f;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;filter:url(#shadow)}.routeEnd{marker-end:url(#goldArrow)}.return{fill:none;stroke:#68a6c1;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:25 20;marker-end:url(#blueArrow)}.optional{fill:none;stroke:#ee934b;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 18;marker-end:url(#orangeArrow)}.step{fill:#aa333b;stroke:#ffaaa0;stroke-width:8;filter:url(#shadow)}.optionalStep{fill:#c66b2b;stroke:#ffd39a;stroke-width:8;filter:url(#shadow)}.stepText{font-family:Arial,sans-serif;fill:#fff;font-size:42px;font-weight:700;text-anchor:middle;dominant-baseline:central}</style>
  </defs>
  <rect width="2048" height="2048" rx="34" fill="url(#bg)"/><rect x="24" y="24" width="2000" height="2000" rx="28" fill="url(#grain)" stroke="#806d4e" stroke-width="8"/>

  <!-- Entrance stairs and the long central intake hall. -->
  <path class="wall" d="M820 1960v-170l-108-72v-178l118-86h72V810h244v644h72l118 86v178l-108 72v170z"/>
  <path class="floor" d="M852 1928v-155l-108-72v-145l97-70h93V842h180v644h93l97 70v145l-108 72v155z"/>
  <path class="drain" d="M921 1812h206v66H921z"/><path class="bars" d="M944 1822v46m40-46v46m40-46v46m40-46v46m40-46v46"/>

  <!-- Main cross corridor. -->
  <path class="wall" d="M246 650h670V506h216v144h670v284h-670v490H916V934H246z"/>
  <path class="floor" d="M278 682h670V538h152v144h670v220h-670v490H948V902H278z"/>
  <path class="drain" d="M972 722h104v140H972z"/><path class="bars" d="M989 742v100m35-100v100m35-100v100"/>

  <!-- Central cell rows and the northern variable-boss cell. -->
  <path class="wall" d="M902 240h244v298H902z"/><path class="cell" d="M934 272h180v234H934z"/>
  <path class="wall" d="M566 920h310v210H566zM566 1168h310v210H566zM1172 920h310v210h-310zM1172 1168h310v210h-310z"/>
  <path class="cell" d="M598 952h246v146H598zM598 1200h246v146H598zM1204 952h246v146h-246zM1204 1200h246v146h-246z"/>
  <!-- Door bars face the hall, so the four rooms read as cells rather than solid blocks. -->
  <path class="bars" d="M806 920v72m-42-72v72M806 1306v72m-42-72v72M1242 920v72m42-72v72M1242 1306v72m42-72v72M982 506v-82m42 82v-82m42 82v-82"/>

  <!-- Western dead-end: Dextren's circular hub with four radiating cells. -->
  <path class="wall" d="M246 628l-95-95 85-180 177-80 154 103 54 176-96 114 93 128-72 184-176 88-165-89-58-182z"/>
  <path class="floor" d="M272 653l-83-126 72-149 148-67 129 86 45 146-101 122 98 135-61 153-150 75-138-75-47-151z"/>
  <circle class="floor" cx="370" cy="665" r="153"/><circle class="drain" cx="370" cy="665" r="63"/>
  <path class="cell" d="M174 382l68-118 151 71-58 139zM414 321l126-78 95 142-122 81zM168 860l127-75 76 136-124 74zM434 854l126-74 89 150-137 73z"/>
  <path class="bars" d="M263 408l58 29M493 383l-36 64M260 841l50 63M493 846l37 65"/>

  <!-- Eastern dead-end: Hamhock's hub, Kam cell, and Bazil's final cell. -->
  <path class="wall" d="M1802 628l95-95-85-180-177-80-154 103-54 176 96 114-93 128 72 184 176 88 165-89 58-182z"/>
  <path class="floor" d="M1776 653l83-126-72-149-148-67-129 86-45 146 101 122-98 135 61 153 150 75 138-75 47-151z"/>
  <circle class="floor" cx="1678" cy="665" r="153"/><circle class="drain" cx="1678" cy="665" r="63"/>
  <path class="cell" d="M1874 382l-68-118-151 71 58 139zM1634 321l-126-78-95 142 122 81zM1880 860l-127-75-76 136 124 74zM1614 854l-126-74-89 150 137 73z"/>
  <path class="bars" d="M1785 408l-58 29M1555 383l36 64M1788 841l-50 63M1555 846l-37 65"/>
  <!-- Bazil occupies the far eastern terminal cell. -->
  <path class="wall" d="M1840 558h150v326h-150z"/><path class="cell" d="M1872 590h86v262h-86z"/>
  <path class="bars" d="M1872 656h-74m74 42h-74m74 42h-74"/>

  <!-- West-first sweep, explicit return, then eastern finish. -->
  <path class="route routeEnd" d="M1024 1900v-1110H370"/>
  <path class="return" d="M370 716h654"/>
  <path class="route routeEnd" d="M1024 790h864V705"/>
  <!-- Candidate rooms for Targorr, Kam, and rare Bruegal are checks, not guaranteed fixed bosses. -->
  <path class="optional" d="M1024 650V360"/>
  <path class="optional" d="M690 790l-82-274"/>
  <path class="optional" d="M1350 790l112-292"/>
  <path class="optional" d="M1024 1080H780"/>

  <circle class="optionalStep" cx="1024" cy="360" r="42"/><text class="stepText" x="1024" y="360">1</text>
  <circle class="optionalStep" cx="608" cy="516" r="42"/><text class="stepText" x="608" y="516">1</text>
  <circle class="optionalStep" cx="1462" cy="498" r="42"/><text class="stepText" x="1462" y="498">1</text>
  <circle class="optionalStep" cx="780" cy="1080" r="42"/><text class="stepText" x="780" y="1080">1</text>
  <circle class="step" cx="370" cy="665" r="48"/><text class="stepText" x="370" y="665">2</text>
  <circle class="step" cx="1678" cy="665" r="48"/><text class="stepText" x="1678" y="665">3</text>
  <circle class="step" cx="1915" cy="705" r="48"/><text class="stepText" x="1915" y="705">4</text>
</svg>
