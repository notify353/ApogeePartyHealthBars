<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#30271c"/><stop offset="1" stop-color="#17140f"/></linearGradient>
    <pattern id="grain" width="80" height="64" patternUnits="userSpaceOnUse"><path d="M4 20c20-10 42-10 64 0M18 52c14-6 30-6 48 0" fill="none" stroke="#c8aa70" stroke-width="2" opacity=".055"/></pattern>
    <pattern id="stone" width="64" height="44" patternUnits="userSpaceOnUse"><path d="M0 22h64M32 0v22M16 22v22M48 22v22" fill="none" stroke="#c0b08e" stroke-width="2" opacity=".13"/></pattern>
    <pattern id="grassPattern" width="58" height="58" patternUnits="userSpaceOnUse"><path d="M8 44l9-12m18 18 6-15M49 23l-7-10M20 18l-4-9" stroke="#9ba77f" stroke-width="2" opacity=".1"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".65"/></filter>
    <marker id="mainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.1" markerHeight="3.1" orient="auto"><path d="M0 0l10 5-10 5z" fill="#ffd34f"/></marker>
    <style>
      .wall{fill:#625947;stroke:#b9a47b;stroke-width:18;stroke-linejoin:round}.floor{fill:#443f37;stroke:#7f735f;stroke-width:7;stroke-linejoin:round}.grass{fill:#344634;stroke:#7f8c6d;stroke-width:7}.door{fill:none;stroke:#d6c59d;stroke-width:14;stroke-linecap:square}.rack{fill:#8d7248;stroke:#c2a870;stroke-width:5}.route{fill:none;stroke:#ffd34f;stroke-width:17;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#mainArrow);filter:url(#shadow)}.step{fill:#912f37;stroke:#ef9a91;stroke-width:6;filter:url(#shadow)}.stepText{font-family:Arial,sans-serif;fill:#fff;font-size:36px;font-weight:700;text-anchor:middle;dominant-baseline:central}
    </style>
  </defs>

  <rect width="2048" height="2048" rx="34" fill="url(#bg)"/><rect x="24" y="24" width="2000" height="2000" rx="28" fill="url(#grain)" stroke="#806d4e" stroke-width="8"/>

  <!-- Scarlet Key entrance: a compact eastbound dogleg into the Training Grounds. -->
  <path class="wall" d="M516 1830h174v-92h116v-66h188v148H806v90H662v-34H516z"/><path class="floor" d="M546 1854h144v-92h116v-60h158v88H776v90H662v-34H546z" fill="url(#stone)"/>
  <path class="door" d="M546 1832v44M806 1702h80"/><path d="M576 1830v46M598 1830v46M620 1830v46" stroke="#c1b38f" stroke-width="7"/>

  <!-- Training Grounds: a rectangular open drill yard with a perimeter walk. -->
  <path class="wall" d="M700 1260h520v480H700z"/><path class="floor" d="M730 1290h460v420H730z" fill="url(#stone)"/>
  <rect class="grass" x="808" y="1368" width="304" height="264"/><rect x="808" y="1368" width="304" height="264" fill="url(#grassPattern)"/>
  <path d="M760 1320h400M760 1680h400" stroke="#9a8d72" stroke-width="9"/><path class="door" d="M922 1260h76M922 1710h76"/>

  <!-- Footman's Armory: two offset chambers joined by short stair corridors. -->
  <path class="wall" d="M844 1018h74v-54h174v54h74v64h54v146h-54v64h-74v54H918v-54h-74v-64h-54v-146h54z"/>
  <path class="floor" d="M874 1048h74v-54h114v54h74v64h54v86h-54v64h-74v54H948v-54h-74v-64h-54v-86h54z" fill="url(#stone)"/>
  <circle cx="1005" cy="1155" r="50" fill="#544a39" stroke="#9e8964" stroke-width="8"/>
  <path class="wall" d="M926 824h74v-54h174v54h74v64h54v146h-54v64h-74v54h-174v-54h-74v-64h-54V888h54z"/>
  <path class="floor" d="M956 854h74v-54h114v54h74v64h54v86h-54v64h-74v54h-114v-54h-74v-64h-54v-86h54z" fill="url(#stone)"/>
  <circle cx="1087" cy="961" r="50" fill="#544a39" stroke="#9e8964" stroke-width="8"/>
  <path class="door" d="M960 1260h76M1096 1098h76"/>

  <!-- Crusader's Armory continues the staggered climb with denser weapon rooms. -->
  <path class="wall" d="M1008 620h74v-54h174v54h74v64h54v146h-54v64h-74v54h-174v-54h-74v-64h-54V684h54z"/>
  <path class="floor" d="M1038 650h74v-54h114v54h74v64h54v86h-54v64h-74v54h-114v-54h-74v-64h-54v-86h54z" fill="url(#stone)"/>
  <circle cx="1169" cy="757" r="50" fill="#544a39" stroke="#9e8964" stroke-width="8"/>
  <path class="wall" d="M926 426h74v-54h174v54h74v64h54v146h-54v64h-74v54h-174v-54h-74v-64h-54V490h54z"/>
  <path class="floor" d="M956 456h74v-54h114v54h74v64h54v86h-54v64h-74v54h-114v-54h-74v-64h-54v-86h54z" fill="url(#stone)"/>
  <circle cx="1087" cy="563" r="50" fill="#544a39" stroke="#9e8964" stroke-width="8"/>
  <g class="rack"><rect x="872" y="1094" width="46" height="22" rx="5"/><rect x="1092" y="1240" width="46" height="22" rx="5"/><rect x="1174" y="850" width="46" height="22" rx="5"/><rect x="1008" y="648" width="46" height="22" rx="5"/><rect x="1210" y="692" width="46" height="22" rx="5"/><rect x="956" y="492" width="46" height="22" rx="5"/></g>
  <path class="door" d="M1178 894h76M1044 700h76"/>

  <!-- Final gallery turns west, then returns east to Herod's raised doorway. -->
  <path class="wall" d="M882 294h492v60h56v162h-120v-78H946v78H826V354h56z"/><path class="floor" d="M912 324h432v60h56v102h-60v-78H916v78h-60V384h56z" fill="url(#stone)"/>
  <path d="M936 352h112M1120 352h112M1304 352h52" stroke="#9f7b46" stroke-width="18" stroke-linecap="round"/>
  <path class="door" d="M1310 438h60M1114 294h76"/>

  <!-- Hall of Champions. -->
  <path class="wall" d="M1090 318v-50h-23v-88a145 145 0 1 1 290 0v88h-23v50z"/><path class="floor" d="M1120 288v-50h-23v-58a115 115 0 1 1 230 0v58h-23v50z" fill="url(#stone)"/>
  <circle cx="1212" cy="180" r="56" fill="#5b4140" stroke="#a66a67" stroke-width="9"/>

  <!-- Route threads around the armory obstacles instead of cutting through the rooms. -->
  <path class="route" d="M568 1854h160v-92h232v-96"/>
  <path class="route" d="M960 1320v-96h104v-112H942v-104h206v-98h110v-108h-150v-98h108v-102H1010v-100h232v-84h106v-74h-136v-76"/>
  <path class="route" d="M1212 292v-62"/>
  <circle class="step" cx="1212" cy="180" r="40"/><text class="stepText" x="1212" y="180">1</text>
</svg>
