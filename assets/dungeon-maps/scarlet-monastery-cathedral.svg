<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30271c"/>
      <stop offset="1" stop-color="#17140f"/>
    </linearGradient>
    <pattern id="grain" width="80" height="64" patternUnits="userSpaceOnUse">
      <path d="M4 20c20-10 42-10 64 0M18 52c14-6 30-6 48 0" fill="none" stroke="#c8aa70" stroke-width="2" opacity=".055"/>
    </pattern>
    <pattern id="stone" width="64" height="44" patternUnits="userSpaceOnUse">
      <path d="M0 22h64M32 0v22M16 22v22M48 22v22" fill="none" stroke="#c0b08e" stroke-width="2" opacity=".13"/>
    </pattern>
    <pattern id="flagstone" width="72" height="52" patternUnits="userSpaceOnUse">
      <path d="M0 26h72M24 0v26M52 26v26" fill="none" stroke="#b8aa8d" stroke-width="2" opacity=".11"/>
    </pattern>
    <pattern id="flowers" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="10" r="3" fill="#bd6742" opacity=".7"/>
      <circle cx="26" cy="23" r="3" fill="#d7a748" opacity=".62"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <marker id="mainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.1" markerHeight="3.1" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#ffd34f"/>
    </marker>
    <marker id="altArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.1" markerHeight="3.1" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#c6aa67"/>
    </marker>
    <marker id="optionalArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="3.1" markerHeight="3.1" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#ee934b"/>
    </marker>
    <style>
      .wall{fill:#625947;stroke:#b9a47b;stroke-width:18;stroke-linejoin:round}
      .floor{fill:#443f37;stroke:#7f735f;stroke-width:7;stroke-linejoin:round}
      .grass{fill:#344634;stroke:#7f8c6d;stroke-width:7}
      .door{fill:none;stroke:#d6c59d;stroke-width:14;stroke-linecap:square}
      .route{fill:none;stroke:#ffd34f;stroke-width:17;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#mainArrow);filter:url(#shadow)}
      .alternate{fill:none;stroke:#c6aa67;stroke-width:13;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20 18;marker-end:url(#altArrow);opacity:.82}
      .optional{fill:none;stroke:#ee934b;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:18 16;marker-end:url(#optionalArrow);filter:url(#shadow)}
      .step{fill:#912f37;stroke:#ef9a91;stroke-width:6;filter:url(#shadow)}
      .stepText{font-family:Arial,sans-serif;fill:#fff;font-size:36px;font-weight:700;text-anchor:middle;dominant-baseline:central}
      .boss{fill:#c96f2b;stroke:#ffd09a;stroke-width:7;filter:url(#shadow)}
    </style>
  </defs>

  <rect width="2048" height="2048" rx="34" fill="url(#bg)"/>
  <rect x="24" y="24" width="2000" height="2000" rx="28" fill="url(#grain)" stroke="#806d4e" stroke-width="8"/>

  <!-- Keyed approach: a short west return, long east hall, then the compact south-facing entrance turn. -->
  <path class="wall" d="M842 1788h110v-60h144v60h514v76h-60v84h-120v-84h-334v84H952v-84H842z"/>
  <path class="floor" d="M872 1818h104v-66h96v66h508v22h-54v84h-72v-84h-382v84h-96v-84H872z"/>
  <path d="M872 1818h104v-66h96v66h508v22h-54v84h-72v-84h-382v84h-96v-84H872z" fill="url(#flagstone)"/>
  <path class="door" d="M976 1752h96M1454 1918h72"/>

  <!-- Lower chapel garden, upper court, side walks, stairs, and the real T-shaped pool. -->
  <path class="wall" d="M780 1746v-118H706v-454h-64V770h132v-102h500v102h132v404h-64v454h-74v118h-190v-92H970v92z"/>
  <path class="grass" d="M810 1716v-118h-74v-394h-64V800h132v-102h440v102h132v404h-64v394h-74v118h-130v-92H940v92z"/>
  <path d="M672 800h132v404H672zM1244 800h132v404h-132zM736 1204h576v394H736z" fill="url(#grain)" opacity=".7"/>
  <rect x="696" y="820" width="48" height="360" rx="12" fill="#6c412f" stroke="#a97755" stroke-width="7"/>
  <rect x="1304" y="820" width="48" height="360" rx="12" fill="#6c412f" stroke="#a97755" stroke-width="7"/>
  <rect x="696" y="820" width="48" height="360" rx="12" fill="url(#flowers)"/>
  <rect x="1304" y="820" width="48" height="360" rx="12" fill="url(#flowers)"/>
  <path d="M736 1168h576v72H736z" fill="#888069" stroke="#b9aa89" stroke-width="7"/>
  <path d="M780 1168v72M814 1168v72M1234 1168v72M1268 1168v72" stroke="#d0c29e" stroke-width="9"/>
  <path d="M944 1590v-372H824v-136a170 170 0 0 1 170-170h60a170 170 0 0 1 170 170v136h-120v372z" fill="#2c737f" stroke="#9bd3d1" stroke-width="11"/>
  <path d="M976 1560v-376H856v-94a138 138 0 0 1 138-138h60a138 138 0 0 1 138 138v94h-120v376z" fill="#3b8991" opacity=".75"/>
  <path class="door" d="M960 1650h128M960 698h128"/>

  <!-- Crusader chapel: narrow nave, side aisles, transept rooms, altar, and rear chamber. -->
  <path class="wall" d="M826 698V450h-78V238h190v-52a86 86 0 0 1 172 0v52h190v212h-78v248z"/>
  <path class="floor" d="M856 668V420h-78V268h190v-82a56 56 0 0 1 112 0v82h190v152h-78v248z"/>
  <path d="M856 420h336v248H856zM778 268h492v152H778z" fill="url(#stone)"/>
  <circle class="wall" cx="1024" cy="132" r="104"/>
  <circle class="floor" cx="1024" cy="132" r="74"/>
  <path d="M968 238h112v-38H968z" fill="#443f37"/>

  <!-- Nave columns and side aisles are drawn as navigation features, not decoration. -->
  <path d="M906 452v190M1142 452v190" stroke="#756b58" stroke-width="12"/>
  <g fill="#a38a56" stroke="#d0b679" stroke-width="3">
    <rect x="880" y="458" width="34" height="24" rx="5"/><rect x="1134" y="458" width="34" height="24" rx="5"/>
    <rect x="880" y="510" width="34" height="24" rx="5"/><rect x="1134" y="510" width="34" height="24" rx="5"/>
    <rect x="880" y="562" width="34" height="24" rx="5"/><rect x="1134" y="562" width="34" height="24" rx="5"/>
    <rect x="880" y="614" width="34" height="24" rx="5"/><rect x="1134" y="614" width="34" height="24" rx="5"/>
  </g>
  <path d="M934 322h180v72H934z" fill="#857353" stroke="#bca679" stroke-width="7"/>
  <path d="M782 300h92v88h-92zM1174 300h92v88h-92z" fill="#51493d" stroke="#81745e" stroke-width="6"/>
  <path d="M794 286h68M1186 286h68" stroke="#bd5151" stroke-width="12"/>
  <path class="door" d="M856 420h50M1142 420h50M856 668h56M1136 668h56M934 268h54M1060 268h54"/>

  <!-- Main route uses the west garden lanes; east is the patrol-dependent alternate. -->
  <path class="route" d="M1490 1910v-76h-466v-178"/>
  <path class="route" d="M930 1552c-116-10-174-72-174-158 0-78 54-132 156-174"/>
  <path class="route" d="M900 1142c-118-10-174-72-174-154 0-80 56-132 172-164"/>
  <path class="route" d="M934 710h90V278"/>
  <path class="alternate" d="M1118 1552c116-10 174-72 174-158 0-78-54-132-156-174"/>
  <path class="alternate" d="M1148 1142c118-10 174-72 174-154 0-80-56-132-172-164"/>

  <!-- Optional Fairbanks room is concealed off the east side of the transept. -->
  <path class="optional" d="M1118 336h94"/>
  <path class="boss" d="M1220 300l34 34-34 34-34-34z"/>
  <path class="boss" d="M1024 276l36 36-36 36-36-36z"/>

  <!-- Small route checkpoints keep the floor plan visible. -->
  <circle class="step" cx="1490" cy="1904" r="40"/><text class="stepText" x="1490" y="1904">1</text>
  <circle class="step" cx="1024" cy="1574" r="40"/><text class="stepText" x="1024" y="1574">2</text>
  <circle class="step" cx="1024" cy="1198" r="40"/><text class="stepText" x="1024" y="1198">3</text>
  <circle class="step" cx="1024" cy="690" r="40"/><text class="stepText" x="1024" y="690">4</text>
  <circle class="step" cx="1024" cy="376" r="40"/><text class="stepText" x="1024" y="376">5</text>
</svg>
