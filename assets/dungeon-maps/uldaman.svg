    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".72"/></filter>
    <style>.caveWall{fill:none;stroke:#b49a70;stroke-width:138;stroke-linecap:round;stroke-linejoin:round}.cave{fill:none;stroke:#4c3d32;stroke-width:94;stroke-linecap:round;stroke-linejoin:round}.earthRoom{fill:url(#earth);stroke:#80654e;stroke-width:10;stroke-linejoin:round}.titanRoom{fill:url(#titan);stroke:#84906b;stroke-width:11;stroke-linejoin:round}.inner{fill:#29352d;stroke:#718066;stroke-width:8}.pillar{fill:#303c33;stroke:#a39772;stroke-width:8}.altar{fill:#53644d;stroke:#c0b57f;stroke-width:9}.route{fill:none;stroke:#ffd34f;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;filter:url(#shadow)}.routeEnd{marker-end:url(#goldArrow)}.optional{fill:none;stroke:#ee934b;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 18;marker-end:url(#orangeArrow)}.alternate{fill:none;stroke:#68a6c1;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 18;marker-end:url(#blueArrow)}.step{fill:#aa333b;stroke:#ffaaa0;stroke-width:8;filter:url(#shadow)}.optionalStep{fill:#c66b2b;stroke:#ffd39a;stroke-width:8;filter:url(#shadow)}.stepText{font-family:Arial,sans-serif;fill:#fff;font-size:42px;font-weight:700;text-anchor:middle;dominant-baseline:central}.transition{fill:#5f87a5;stroke:#a8d5ef;stroke-width:7;filter:url(#shadow)}</style>
  </defs>
