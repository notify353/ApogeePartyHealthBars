    <marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#68a6c1"/></marker>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".72"/></filter>
    <style>.corridorWall{fill:none;stroke:#b49770;stroke-width:134;stroke-linecap:round;stroke-linejoin:round}.corridor{fill:none;stroke:#574436;stroke-width:92;stroke-linecap:round;stroke-linejoin:round}.floor{fill:url(#earth);stroke:#85684e;stroke-width:9;stroke-linejoin:round}.ledge{fill:#384a32;stroke:#84906b;stroke-width:10}.cave{fill:#303b35;stroke:#75826a;stroke-width:10}.hut{fill:#3d3028;stroke:#b49770;stroke-width:14;stroke-linejoin:round}.thorn{fill:#4d392d;stroke:#947454;stroke-width:7}.bridgeBase{fill:none;stroke:#2a201a;stroke-width:94;stroke-linecap:round}.bridge{fill:none;stroke:url(#planks);stroke-width:76;stroke-linecap:butt}.route{fill:none;stroke:#ffd34f;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;filter:url(#shadow)}.routeEnd{marker-end:url(#goldArrow)}.optional{fill:none;stroke:#ee934b;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 18;marker-end:url(#orangeArrow)}.alternate{fill:none;stroke:#68a6c1;stroke-width:14;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22 18;marker-end:url(#blueArrow)}.step{fill:#aa333b;stroke:#ffaaa0;stroke-width:8;filter:url(#shadow)}.optionalStep{fill:#c66b2b;stroke:#ffd39a;stroke-width:8;filter:url(#shadow)}.stepText{font-family:Arial,sans-serif;fill:#fff;font-size:42px;font-weight:700;text-anchor:middle;dominant-baseline:central}.ward{fill:#597e98;stroke:#a8d5ef;stroke-width:8;filter:url(#shadow)}</style>
  </defs>
