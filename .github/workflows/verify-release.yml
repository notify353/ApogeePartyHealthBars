# Dispatch on the same approved production tag.
name: Verify Apogee Forever publication
on:
  workflow_dispatch:
    inputs:
      upload_run:
        description: Successful upload Actions run ID for this tag
        required: true
      download_url:
        description: Exact approved CurseForge file download link
        required: true
permissions:
  contents: read
jobs:
  verify:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify artifact comes from this tag's completed publisher
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_RUN: ${{ inputs.upload_run }}
        shell: python
        run: |
          import json, os, subprocess
          run = os.environ['UPLOAD_RUN']
          assert run.isdigit(), 'Numeric upload run required'
          info = json.loads(subprocess.check_output(['gh','api','repos/notify353/ApogeePartyHealthBars/actions/runs/'+run]))
          assert info['head_sha'] == os.environ['GITHUB_SHA'], 'Wrong source commit'
          assert info['path'] == '.github/workflows/release.yml' and info['event'] == 'push', 'Wrong publisher workflow'
          assert info['status'] == 'completed' and info['conclusion'] == 'success', 'Publisher did not succeed'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: apogee-publication
          run-id: ${{ inputs.upload_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apogee-publication
      - name: Compare both remote packages and publish GitHub draft
        env:
          APOGEE_PUBLISH_APPROVED: 'true'
          GH_TOKEN: ${{ github.token }}
          CF_DOWNLOAD_URL: ${{ inputs.download_url }}
        run: python -B scripts/publish_distribution.py verify --output "$RUNNER_TEMP/apogee-publication" --curseforge-download-url "$CF_DOWNLOAD_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: apogee-publication-verification
          path: ${{ runner.temp }}/apogee-publication/receipt.json
