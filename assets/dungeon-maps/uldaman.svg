    <pattern id="earth" width="64" height="50" patternUnits="userSpaceOnUse"><path d="M8 16l18-8 20 7M16 42l18-7 18 6" fill="none" stroke="#b9825b" stroke-width="3" opacity=".2"/></pattern>
